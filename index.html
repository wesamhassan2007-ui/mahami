<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee;--card:#fff;--ink:#1d1d1b;--ink2:#5f5e5a;--ink3:#8f8d86;--line:#e3e0d8;--line2:#cfcbc1;
  --accent:#1f4e79;--accent-bg:#e6eef7;
  --danger:#a32d2d;--danger-bg:#fcebeb;--ok:#2f6b12;--ok-bg:#eaf3de;--warn:#8a520b;--warn-bg:#faeeda;--wait:#534ab7;--wait-bg:#eeedfe;
  --fire:#b8392b;--fire-bg:#fbe9e6;--build:#9a6410;--build-bg:#f8eedc;--admin:#1f5f99;--admin-bg:#e4eef8;--project:#0f6e56;--project-bg:#e1f5ee;--market:#993556;--market-bg:#fbeaf0;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:8px 14px}
button:hover{border-color:var(--ink3)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--danger);border-color:#e9b8b8}
input,select,textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r);padding:9px 11px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:380px}
.login-card h1{margin:0 0 4px;font-size:22px;font-weight:600}
.demo{margin-top:18px;border-top:1px dashed var(--line2);padding-top:12px}
.demo button{display:flex;justify-content:space-between;width:100%;margin-top:6px;font-size:13px;padding:7px 10px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:6px}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{max-width:980px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hbar h1{font-size:18px;margin:0;font-weight:600;flex:1}
.who{font-size:13px;text-align:left;line-height:1.3}
.who b{font-weight:500;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tab{white-space:nowrap;border-radius:999px;padding:6px 14px;font-size:14px;background:transparent}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:right}
.stat .n{font-size:22px;font-weight:600;line-height:1.2}
.stat .l{font-size:12px;color:var(--ink2)}
.stat.on{outline:2px solid var(--ink)}
.stat.late .n{color:var(--danger)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 180px;width:auto}
.tools select{width:auto;flex:0 1 150px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}

/* task cards */
.list{display:flex;flex-direction:column;gap:8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:block;width:100%;text-align:right}
.task:hover{border-color:var(--line2)}
.task .top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.task .t{font-weight:500}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.s-new{background:var(--accent-bg);color:var(--accent)}
.s-progress{background:var(--warn-bg);color:var(--warn)}
.s-waiting{background:var(--wait-bg);color:var(--wait)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.s-late{background:var(--danger-bg);color:var(--danger)}
.d-fire{background:var(--fire-bg);color:var(--fire)}
.d-build{background:var(--build-bg);color:var(--build)}
.d-admin{background:var(--admin-bg);color:var(--admin)}
.d-project{background:var(--project-bg);color:var(--project)}
.d-market{background:var(--market-bg);color:var(--market)}
.psum{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.psum h3{margin:0 0 8px;font-size:15px;font-weight:600}
.prow{display:grid;grid-template-columns:90px 1fr 54px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.prow .bar{margin:0}.prow .bar i{background:var(--project)}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.money .n{font-weight:600;font-size:16px}.money .l{font-size:12px;color:var(--ink2)}
.pri-high{color:var(--danger);font-weight:500}
.empty{text-align:center;padding:40px 10px;color:var(--ink2);background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}

/* by worker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wcard .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--accent-bg);color:var(--accent);flex:none}
.bar{height:6px;background:#eceae4;border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.wtask{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 24px}
@media(min-width:700px){.sheet{border-radius:16px}}
.sheet h2{margin:0;font-size:18px;font-weight:600}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.shead h2{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sect h3{font-size:14px;margin:0 0 8px;font-weight:600}
.status-btns{display:flex;gap:6px;flex-wrap:wrap}
.status-btns button{font-size:13px;padding:6px 12px;border-radius:999px}
.status-btns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stages{display:flex;gap:4px}
.stages button{flex:1;font-size:12px;padding:6px 2px;border-radius:6px}
.stages button.done{background:var(--build-bg);color:var(--build);border-color:#e6cfa3}
.stages button.on{background:var(--build);color:#fff;border-color:var(--build)}
.note{background:#f8f7f4;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.note .by{font-size:12px;color:var(--ink2)}
.addnote{display:flex;gap:6px;margin-top:6px}
.addnote textarea{min-height:42px;resize:vertical}
.share{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.share label{display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:14px}
.share input{width:auto}
.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.urow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.urow .info{flex:1;min-width:0}
.ro{background:#f8f7f4;border-radius:8px;padding:8px 11px;min-height:40px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;z-index:40}
.fab{position:fixed;bottom:18px;left:18px;z-index:6;border-radius:999px;padding:12px 18px;font-weight:500}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}

/* ===== أيقونات وتفاعل ===== */
.ic{flex:none;vertical-align:-2px;transition:transform .2s,color .15s}
button{transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:active{transform:scale(.97)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.logo.big{width:52px;height:52px;border-radius:14px;margin-bottom:12px}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px}
.hbtn:hover .ic{transform:scale(1.12)}
@media(max-width:560px){.hbtn span{display:none}.hbtn{padding:8px}.who{display:none}}
.inp{position:relative}
.inp>.ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.inp input{padding-right:36px;width:100%!important}
.inp:focus-within>.ic{color:var(--accent)}
.inp.grow{flex:1 1 180px}
.tab{display:inline-flex;align-items:center;gap:6px;border-color:var(--line)}
.tab:hover{border-color:var(--line2);transform:translateY(-1px)}
.t-fire .ic{color:var(--fire)}.t-build .ic{color:var(--build)}.t-admin .ic{color:var(--admin)}.t-project .ic{color:var(--project)}.t-market .ic{color:var(--market)}
.tab.on .ic{color:#fff}
.tab.on.t-fire{background:var(--fire);border-color:var(--fire)}.tab.on.t-build{background:var(--build);border-color:var(--build)}
.tab.on.t-admin{background:var(--admin);border-color:var(--admin)}.tab.on.t-project{background:var(--project);border-color:var(--project)}.tab.on.t-market{background:var(--market);border-color:var(--market)}
.stat{display:flex;align-items:center;gap:10px}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,30,25,.06)}
.stat:hover .sic .ic{transform:scale(1.15)}
.sic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.st-all .sic{background:var(--accent-bg);color:var(--accent)}.st-progress .sic{background:var(--warn-bg);color:var(--warn)}
.st-late .sic{background:var(--danger-bg);color:var(--danger)}.st-late .n{color:var(--danger)}.st-done .sic{background:var(--ok-bg);color:var(--ok)}
.seg button{display:inline-flex;gap:6px;align-items:center}
.task{display:flex;gap:12px;align-items:flex-start;transition:transform .15s,box-shadow .15s,border-color .15s;animation:rise .35s ease both;animation-delay:calc(var(--i,0)*35ms)}
.task:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,30,25,.07)}
.task:active{transform:scale(.99)}
.task.is-late{border-color:#efc9c9;background:linear-gradient(to left,#fff7f7,#fff 40%)}
.task.is-done .t{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--line2)}
.task.is-done .dico{filter:grayscale(.6);opacity:.7}
.dico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .2s}
.task:hover .dico{transform:rotate(-6deg) scale(1.06)}
.tbody{flex:1;min-width:0}
.chev{color:var(--ink3);align-self:center;transition:transform .15s,color .15s;display:grid}
.task:hover .chev{transform:translateX(-4px);color:var(--ink)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{color:var(--ink3)}
.txt-late,.txt-late .ic,.pri-high .ic{color:var(--danger)!important}
.cnt{background:#f3f1ec;border-radius:999px;padding:0 7px}
.chip{display:inline-flex;align-items:center;gap:4px}
.mini-stages{display:flex;align-items:center;gap:3px;margin-top:8px}
.mini-stages i{width:20px;height:5px;border-radius:3px;background:#ebe7de}
.mini-stages i.on{background:var(--build)}
.mini-stages span{font-size:12px;color:var(--build);margin-right:6px;font-weight:500}
.bar i{width:var(--w,0);animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px}
.empty .eico{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);margin-bottom:6px}
.fab{display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.fab:hover{transform:translateY(-2px)}.fab:hover .ic{transform:rotate(90deg)}
.ov{animation:fade .2s}.sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.xbtn{border:0;background:#f1efe9;border-radius:50%;width:36px;height:36px;padding:0;display:grid;place-items:center}
.xbtn:hover{background:#e6e3db}.xbtn:hover .ic{transform:rotate(90deg)}
.status-btns button{display:inline-flex;align-items:center;gap:5px}
.status-btns button.sb-new .ic{color:var(--accent)}.status-btns button.sb-progress .ic{color:var(--warn)}.status-btns button.sb-waiting .ic{color:var(--wait)}.status-btns button.sb-done .ic{color:var(--ok)}
.status-btns button.on .ic{color:#fff;animation:pop .35s}
.status-btns button.on.sb-new{background:var(--accent);border-color:var(--accent)}.status-btns button.on.sb-progress{background:var(--warn);border-color:var(--warn)}
.status-btns button.on.sb-waiting{background:var(--wait);border-color:var(--wait)}.status-btns button.on.sb-done{background:var(--ok);border-color:var(--ok)}
.sect h3,.psum h3{display:flex;align-items:center;gap:6px}
.sect h3 .ic,.psum h3 .ic{color:var(--ink3)}
.ibtn{display:inline-grid;place-items:center;padding:8px 11px}
.actions button,#uAdd{display:inline-flex;align-items:center;gap:6px}
.money .l{display:flex;align-items:center;gap:4px}
.wcard{transition:transform .15s,box-shadow .15s;animation:rise .35s both}
.wcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,30,25,.07)}
.wtask:hover span:first-child{color:var(--accent)}
.demo button:hover{background:#f8f7f4}
.urow{transition:background .15s}.urow:hover{background:#faf9f6}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{width:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{50%{transform:scale(1.4)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== التنقل والصفحات الجديدة ===== */
#app{padding-bottom:84px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2);padding:6px 2px;position:relative;border-radius:12px}
.bnav button .ic{width:22px;height:22px}
.bnav button.on{color:var(--ink);background:#f1efe9;font-weight:600}
.bnav button:active{transform:scale(.94)}
.badge{position:absolute;top:2px;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-weight:600;display:none}
.badge.on{display:block;animation:pop .35s}
.fabs{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.fab{position:static}
.fab-mic{width:52px;height:52px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:#fff;border:0;box-shadow:0 8px 22px rgba(31,78,121,.35)}
.fab-mic .ic{width:24px;height:24px}
.fab-mic:hover{transform:translateY(-2px)}
.tools2{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;border-color:var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:var(--r);padding:8px 14px;text-decoration:none;color:var(--ink)}
.btn.wa{background:#e7f8ee;border-color:#a8dfbf;color:#127a3e}
.btn.wa:hover{background:#d6f3e2}
.phead{margin:14px 0 10px}.phead h2{margin:0;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.sh{font-size:15px;font-weight:600;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sh .ic{color:var(--ink3)}
.g-late{color:var(--danger)}.g-today{color:var(--accent)}
.dprog{display:flex;align-items:center;gap:10px;margin-bottom:6px}.dprog .bar{flex:1;height:8px;border-radius:4px}
.checklist{display:flex;flex-direction:column}
.citem{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:11px 2px;font-size:15px}
.citem:last-child{border-bottom:0}
.citem .ic{color:var(--ink3);flex:none}
.citem span{flex:1;min-width:0;cursor:pointer}
.citem small{color:var(--ink3);font-size:12px;margin-right:4px}
.citem.on span{color:var(--ink3);text-decoration:line-through}
.citem.on .ic{color:var(--ok)}
.citem .cb{border:0;background:transparent;padding:0;display:grid}
button.citem:active{transform:none;background:#f8f7f4}
.citem.on>.ic,.citem.on .cb .ic{animation:pop .35s}
.ditem{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;color:var(--ink2)}
.ditem.on{color:var(--ok)}.ditem small{margin-right:auto;color:var(--ink3)}
.alldone{display:flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:8px 10px;margin-top:8px;font-weight:500}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{font-size:12px;padding:5px 9px;border-radius:999px}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.quick{display:flex;gap:6px;margin-bottom:6px}.quick input:first-child{flex:1}.quick input[type=date]{width:150px;flex:none}
.cntb{background:var(--danger);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-right:2px}
.tab.on .cntb{background:#fff;color:var(--danger)}
.d-in{background:var(--accent-bg);color:var(--accent)}.d-out{background:var(--wait-bg);color:var(--wait)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-bottom:6px}
.ph{aspect-ratio:1;border-radius:10px;overflow:hidden;padding:0;border:1px solid var(--line);display:grid;place-items:center;background:#f8f7f4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--ink2);border-style:dashed;margin:0}
.cal{padding:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh b{font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cw{font-size:11px;color:var(--ink3);text-align:center;padding:2px 0}
.cd{aspect-ratio:1;border-radius:8px;padding:3px;border:1px solid transparent;background:#f8f7f4;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;font-size:13px}
.cd.blank{background:transparent}
.cd.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cd.sel{background:var(--ink);color:#fff}
.dots{display:flex;gap:2px;min-height:6px}
.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}

const normPhone = p => { let d=String(p||'').replace(/[^\d]/g,'').replace(/^00/,'');
  if(d.startsWith('225') && d.length===13) d=d.slice(3);        // +225 07...
  if(d.startsWith('962') && d.length===12) d='0'+d.slice(3);    // +962 7...
  return d };

function statusChip(t){ if(isLate(t)) return `<span class="chip s-late">${ic('late',13)}متأخرة</span>`; const s=STATUSES.find(x=>x.k===t.status); return `<span class="chip s-${t.status}">${ic(t.status,13)}${s?s.l:''}</span>` }
function deptChip(k){return `<span class="chip d-${k}">${ic(k,13)}${DEPTS[k].short}</span>`}
function animateCounts(root){
  root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count; if(matchMedia('(prefers-reduced-motion: reduce)').matches||!to){el.textContent=to;return}
    const t0=performance.now(), dur=500; const step=now=>{const p=Math.min(1,(now-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step)}; requestAnimationFrame(step)});
}

const UI = {tab:'all', stat:'all', view:'list', q:'', worker:'', page:'tasks', reqTab:'in', cal:null, calDay:null};

function startApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#meName').textContent=me.name;
  $('#meRole').textContent=roleName(me.role)+(me.dept?' · '+DEPTS[me.dept].short:'');
  $('#btnUsers').classList.toggle('hidden',!canManageUsers());
  $('#btnPerms').classList.toggle('hidden',!canManageUsers());
  UI.tab = isTop(me)?'all':(scopeOf(me).length>1?'scope':me.dept); UI.stat='all'; UI.q=''; UI.worker=''; $('#q').value='';
  UI.view='list'; initLang(); showPage('tasks');
}

function visibleTasks(){ return DB.load().tasks.filter(t=>canSee(t)&&!isArchived(t)) }
function tabTasks(){
  const all=visibleTasks();
  if(UI.tab==='all') return all;
  if(UI.tab==='shared') return all.filter(t=>!inScope(t.dept));
  if(UI.tab==='scope') return all.filter(t=>inScope(t.dept));
  return all.filter(t=>t.dept===UI.tab);
}
function filtered(){
  let list=tabTasks();
  if(UI.stat==='progress') list=list.filter(t=>t.status!=='done'&&!isLate(t));
  if(UI.stat==='late') list=list.filter(isLate);
  if(UI.stat==='done') list=list.filter(t=>t.status==='done');
  if(UI.worker) list=list.filter(t=>t.assignee===UI.worker);
  if(UI.q){ const q=UI.q.trim(); list=list.filter(t=>[t.title,t.type,t.desc,uname(t.assignee),...Object.values(t.fields||{})].join(' ').includes(q)) }
  const w={high:0,normal:1,low:2};
  return list.sort((a,b)=>(a.status==='done')-(b.status==='done') || isLate(b)-isLate(a) || (w[a.priority]-w[b.priority]) || String(a.due).localeCompare(String(b.due)));
}

function render(){
  if(!me) return;
  updateBadges();
  if(UI.page==='tasks') renderTasks();
  else if(UI.page==='daily') renderDaily();
  else if(UI.page==='requests') renderRequests();
  else if(UI.page==='mine') renderMine();
  else if(UI.page==='lists') renderLists();
  else if(UI.page==='mgr') renderMgr();
}
function renderTasks(){
  // التبويبات
  const tabs=[];
  if(isTop(me)){ tabs.push(['all','الكل','all']); Object.keys(DEPTS).forEach(k=>tabs.push([k,DEPTS[k].name,k])) }
  else { const sc=scopeOf(me); if(sc.length>1) tabs.push(['scope','الكل','all']); sc.forEach(k=>tabs.push([k,DEPTS[k].name,k])); if(visibleTasks().some(t=>!sc.includes(t.dept))) tabs.push(['shared','مشتركة معي','share']) }
  $('#tabs').innerHTML=tabs.map(([k,l,i])=>`<button class="tab t-${k} ${UI.tab===k?'on':''}" data-k="${k}">${ic(i,16)}${esc(l)}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.k;UI.worker='';render()});

  // الأرقام
  const base=tabTasks();
  const st=[['all','كل المهام',base.length,'tasks'],['progress','مفتوحة',base.filter(t=>t.status!=='done'&&!isLate(t)).length,'progress'],['late','متأخرة',base.filter(isLate).length,'late'],['done','منتهية',base.filter(t=>t.status==='done').length,'done']];
  $('#stats').innerHTML=st.map(([k,l,n,i])=>`<button class="stat st-${k} ${UI.stat===k?'on':''}" data-k="${k}"><span class="sic">${ic(i,18)}</span><div><div class="n" data-count="${n}">${n}</div><div class="l">${l}</div></div></button>`).join('');
  animateCounts($('#stats'));
  $('#stats').querySelectorAll('.stat').forEach(b=>b.onclick=()=>{UI.stat=UI.stat===b.dataset.k?'all':b.dataset.k;render()});

  // فلتر العامل

  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.view));
  renderView(); renderTools2();
}

function dateStub(t,late){

  const d=new Date(t.due+'T12:00:00'), k=late?'late':t.status==='done'?'done':t.due===today()?'today':'norm';

}
function taskCard(t,i=0){

const money = v => (Math.round(+v||0)).toLocaleString('en-US');
function projectSummary(){

  const ts=tabTasks();

function openTask(id, isNew=false, newDept=null){
  const data=DB.load();
  let t = isNew ? {id:'t'+uid(),dept:newDept||creatableDepts()[0],type:'',title:'',desc:'',assignee:'',status:'new',priority:'normal',due:today(3),stage:0,fields:{},sharedWith:[],notes:[],createdBy:me.id,createdAt:Date.now()} : data.tasks.find(x=>x.id===id);
  if(!t) return;
  if(isNew && PREFILL){ Object.assign(t,PREFILL); PREFILL=null }
  const full = isNew || canEditFull(t);
  const dis = full?'':'disabled';
  if(!t.repeat && t.fields?.recurring){ t.repeat={'يومياً':'daily','أسبوعياً':'weekly','شهرياً':'monthly'}[t.fields.recurring]||'none' }
  t.photos=t.photos||[];
  const D=DEPTS[t.dept];
  const isOther = !!t.type && !D.types.includes(t.type);
  const deptList = isNew ? creatableDepts() : movableDepts(t);
  const deptSel = deptList.length>1
    ? `<label>${isNew?'القسم':ic('out',13)+' القسم (فيك تنقل المهمة لقسم تاني)'}</label><select id="tDept">${deptList.map(k=>`<option value="${k}" ${k===t.dept?'selected':''}>${DEPTS[k].name}</option>`).join('')}</select>` : '';

  const stagesHtml = D.stages ? `<div class="sect"><h3>${ic('build',15)} مرحلة الشحنة / الطلبية</h3><div class="stages" id="tStages">${D.stages.map((s,i)=>`<button type="button" data-i="${i}" class="${i<(t.stage??0)?'done':''} ${i===(t.stage??0)?'on':''}">${s}</button>`).join('')}</div></div>` : '';

  const notesHtml = isNew ? '' : `<div class="sect"><h3>${ic('message',15)} الملاحظات والتحديثات (${t.notes.length})</h3>
    <div id="tNotes">${t.notes.length? t.notes.slice().reverse().map(n=>`<div class="note"><div class="by">${esc(n.byName||uname(n.by))} · ${fmtTime(n.at)}</div>${esc(n.text).replace(/\n/g,'<br>')}</div>`).join('') : '<div class="small muted">ما في ملاحظات لسا</div>'}</div>
    <div class="addnote"><textarea id="tNote" placeholder="اكتب ملاحظة أو تحديث…"></textarea><button class="primary ibtn" id="tNoteBtn" aria-label="إضافة">${ic('send',18)}</button></div></div>`;

  let shareHtml='';

    const others=data.users.filter(u=>!isTop(u) && !inScope(t.dept,u));

      <div class="share">${others.map(u=>`<label><input type="checkbox" value="${u.id}" ${t.sharedWith.includes(u.id)?'checked':''}> ${esc(u.name)} <span class="muted small">· ${roleName(u.role)} · ${DEPTS[u.dept]?.short||''}</span></label>`).join('')||'<span class="small muted">ما في موظفين بأقسام تانية</span>'}</div></div>`;
  }

  openModal(`
    <div class="shead"><h2 ${isNew?'':'data-notr'}>${isNew?'مهمة جديدة':esc(t.title)}</h2>${isNew?'':deptChip(t.dept)}<button class="xbtn" id="mClose" aria-label="إغلاق">${ic('x',18)}</button></div>
    ${!isNew&&isArchived(t)?`<div class="archbar">${ic('archive',15)} هالمهمة بالأرشيف <button id="tUnarch">${ic('repeat',14)} رجّعها</button></div>`:''}
    ${!full?'<div class="small muted">بتقدر تغيّر الحالة وتضيف ملاحظات. باقي التفاصيل بيعدّلها رئيس القسم أو الإدارة.</div>':''}
    ${deptSel}
    <label>عنوان المهمة</label><input id="tTitle" value="${esc(t.title)}" ${dis} placeholder="شو المطلوب؟">
    <div class="row2">
      <div><label>نوع المهمة</label><select id="tType" ${dis}>${D.types.map(x=>`<option ${x===t.type?'selected':''}>${x}</option>`).join('')}<option value="__other" ${isOther?'selected':''}>غير (اكتبه إنت)</option></select>
        <input id="tTypeOther" class="${isOther?'':'hidden'}" style="margin-top:6px" value="${esc(isOther?t.type:'')}" placeholder="اكتب نوع المهمة" ${dis}></div>
      <div><label>المسؤول</label><select id="tAssignee" ${dis}>${assigneeOptions(t.dept,t.assignee)}</select></div>

      <div><label>الأولوية</label><select id="tPri" ${dis}>${Object.entries(PRI).map(([k,l])=>`<option value="${k}" ${k===t.priority?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label>${ic('repeat',13)} تتكرر</label><select id="tRepeat" ${dis}>${Object.entries(REPEAT).map(([k,l])=>`<option value="${k}" ${k===(t.repeat||'none')?'selected':''}>${l}</option>`).join('')}</select></div>
      ${D.fields.map(fd=>`<div><label>${fd.l}</label>${fieldInput(fd,t.fields[fd.k],!full)}</div>`).join('')}
    </div>
    <label>تفاصيل</label><textarea id="tDesc" rows="2" ${dis}>${esc(t.desc)}</textarea>
    <div class="sect"><h3>${ic('progress',15)} الحالة</h3><div class="status-btns" id="tStatus">${STATUSES.map(s=>`<button type="button" data-k="${s.k}" class="sb-${s.k} ${s.k===t.status?'on':''}">${ic(s.k,15)}${s.l}</button>`).join('')}</div></div>
    ${datalists(D)}
    ${stagesHtml}
    ${isNew?'':photosHtml(t)}
    ${shareHtml}
    ${notesHtml}
    <div class="actions">

      <button id="tCancel">إلغاء</button>

      ${!isNew?mailLink(t.assignee,taskSubj(t), waTaskText(t)):''}
      ${!isNew&&canDelete(t)?`<button class="danger" id="tDel" style="margin-right:auto">${ic('trash',15)} حذف</button>`:''}
    </div>
    <div class="err" id="tErr"></div>`);

  let status=t.status, stage=t.stage??0; t._origAssignee=t.assignee;
  $('#tType').onchange=e=>{ const o=e.target.value==='__other'; $('#tTypeOther').classList.toggle('hidden',!o); if(o) $('#tTypeOther').focus() };
  $('#mClose').onclick=$('#tCancel').onclick=closeModal;
  if($('#tDept')) $('#tDept').onchange=e=>{ const nd=e.target.value;
    if(isNew){ closeModal(); openTask(null,true,nd); return }
    const from=DEPTS[t.dept].name; t.dept=nd; t.stage=0; t.updatedAt=Date.now();
    t.notes.push({by:me.id,byName:me.name,text:`نقل المهمة من ${from} لـ ${DEPTS[nd].name}`,at:Date.now()});
    DB.save(); API.putTask(t,'full').then(()=>toast('انتقلت المهمة لـ '+DEPTS[nd].name)).catch(errToast); openTask(t.id); render() };
  $('#tStatus').querySelectorAll('button').forEach(b=>b.onclick=()=>{status=b.dataset.k;$('#tStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  if($('#tStages')) $('#tStages').querySelectorAll('button').forEach(b=>b.onclick=()=>{stage=+b.dataset.i;$('#tStages').querySelectorAll('button').forEach((x,i)=>{x.classList.toggle('on',i===stage);x.classList.toggle('done',i<stage)})});

  if(!isNew) bindPhotos(t);
  if($('#tUnarch')) $('#tUnarch').onclick=()=>{ t.status='progress'; t.doneAt=null; t.updatedAt=Date.now(); t.notes.push({by:me.id,byName:me.name,text:'رجّع المهمة من الأرشيف',at:Date.now()}); DB.save();
    API.putTask(t,'limited').then(()=>toast('رجعت المهمة')).catch(errToast); openTask(t.id); render() };
  if(!isNew) $('#tNoteBtn').onclick=()=>{
    const txt=$('#tNote').value.trim(); if(!txt) return;
    t.notes.push({by:me.id,byName:me.name,text:txt,at:Date.now()}); t.updatedAt=Date.now(); DB.save();
    API.putTask(t,'limited').then(()=>toast('انضافت الملاحظة')).catch(errToast); closeModal(); openTask(t.id); render();
  };

  $('#tSave').onclick=()=>{
    if(full){
      const title=$('#tTitle').value.trim();
      if(!title){ $('#tErr').textContent='اكتب عنوان المهمة'; $('#tTitle').focus(); return }
      const tv=$('#tType').value, tother=$('#tTypeOther').value.trim();
      if(tv==='__other' && !tother){ $('#tErr').textContent='اكتب نوع المهمة'; $('#tTypeOther').focus(); return }
      t.title=title; t.type=tv==='__other'?tother:tv; t.assignee=$('#tAssignee').value; t.due=$('#tDue').value;
      t.priority=$('#tPri').value; t.desc=$('#tDesc').value.trim(); t.repeat=$('#tRepeat').value;
      document.querySelectorAll('[data-f]').forEach(el=>t.fields[el.dataset.f]=el.value);
    }
    if(t.status!==status && !isNew){ t.notes.push({by:me.id,byName:me.name,text:`غيّر الحالة إلى: ${STATUSES.find(s=>s.k===status).l}`,at:Date.now()}) }
    if(D.stages && (t.stage??0)!==stage && !isNew){ t.notes.push({by:me.id,byName:me.name,text:`نقل المرحلة إلى: ${D.stages[stage]}`,at:Date.now()}) }
    const prevStatus=t.status, prevAssignee=t._origAssignee;
    t.status=status; if(D.stages) t.stage=stage;
    if(status==='done' && prevStatus!=='done') t.doneAt=Date.now(); if(status!=='done') t.doneAt=null;
    const spawn = (status==='done' && prevStatus!=='done' && t.repeat && t.repeat!=='none' && !t.spawned && !isNew) ? spawnNext(t) : null;
    if(canShare()) t.sharedWith=[...document.querySelectorAll('.share input:checked')].map(i=>i.value);
    t.updatedAt=Date.now();
    if(isNew && !LIVE) data.tasks.push(t);
    const offerSend = t.assignee && t.assignee!==me.id && (isNew || t.assignee!==prevAssignee);
    DB.save(); if(offerSend) showSendSheet([{kind:'task',to:t.assignee,title:t.title,dept:t.dept,due:t.due,priority:t.priority,desc:t.desc}]); else closeModal(); render();
    API.putTask(t, isNew?'new':(full?'full':'limited')).then(()=>toast(isNew?'انضافت المهمة':'انحفظت التعديلات')).catch(errToast);
    if(spawn){ if(!LIVE) data.tasks.push(spawn); DB.save(); render() }
    if(spawn) API.putTask(spawn,'new').then(()=>toast('انعملت المهمة الجاية تلقائياً · '+fmtDate(spawn.due))).catch(errToast);
    if(t.assignee && t.assignee!==me.id && (isNew || t.assignee!==prevAssignee))
      sendMail([t.assignee], 'مهمة جديدة إلك: '+t.title, waTaskText(t));
  };
  if($('#tDel')) $('#tDel').onclick=()=>{
    const b=$('#tDel');
    if(b.dataset.c!=='1'){ b.dataset.c='1'; b.textContent='متأكد؟ اضغط مرة تانية'; return }
    if(!LIVE) data.tasks=data.tasks.filter(x=>x.id!==t.id); DB.save(); closeModal(); render();
    API.delTask(t.id).then(()=>toast('انحذفت المهمة')).catch(errToast);
  };
}

function editUser(id){
  const data=DB.load();
  const isNew=!id; const u=isNew?{id:'u'+uid(),name:'',phone:'',password:'',role:'worker',dept:'fire'}:data.users.find(x=>x.id===id);
  const roles = Object.keys(allRoles()).filter(r=>me.role==='manager'||r!=='manager');
  const locked = !isNew && u.role==='manager' && me.role!=='manager';
  openModal(`
    <div class="shead"><h2>${isNew?'موظف جديد':'تعديل '+esc(u.name)}</h2><button class="xbtn" id="mClose" aria-label="إغلاق">${ic('x',18)}</button></div>
    ${locked?'<div class="small muted">ما بتقدر تعدّل حساب المدير.</div>':''}
    <label>الاسم</label><input id="uName" value="${esc(u.name)}" ${locked?'disabled':''}>
    <div class="row2">
      <div><label>رقم التلفون</label><input id="uPhone" type="tel" value="${esc(u.phone)}" ${locked?'disabled':''}></div>
      <div><label>كلمة السر</label><input id="uPass" value="${isNew?String(Math.floor(100000+Math.random()*900000)):''}" placeholder="${isNew?'':'اتركها فاضية إذا ما بدك تغيّرها'}" ${locked?'disabled':''}></div>
      <div><label>الدور</label><select id="uRole" ${locked?'disabled':''}>${roles.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${roleName(r)}</option>`).join('')}</select></div>
      <div><label>${ic('globe',13)} لغة الصفحة</label><select id="uLang" ${locked?'disabled':''}><option value="ar" ${u.lang!=='fr'?'selected':''}>عربي</option><option value="fr" ${u.lang==='fr'?'selected':''}>Français</option></select></div>
      <div><label>${ic('mail',13)} الإيميل (اختياري)</label><input id="uEmail" type="email" dir="ltr" value="${esc(u.email||'')}" placeholder="name@gmail.com" ${locked?'disabled':''}></div>
      <div id="uDeptWrap"><label>القسم</label><select id="uDept" ${locked?'disabled':''}>${Object.keys(DEPTS).map(k=>`<option value="${k}" ${k===u.dept?'selected':''}>${DEPTS[k].name}</option>`).join('')}</select></div>
    </div>
    <div class="err" id="uErr"></div>
    <div class="actions">${locked?'':`<button class="primary" id="uSave">حفظ</button>`}<button id="uBack">رجوع</button>${!isNew&&!locked&&u.id!==me.id?`<button class="danger" id="uDel" style="margin-right:auto">${ic('trash',15)} حذف</button>`:''}</div>`);
  const syncDept=()=>$('#uDeptWrap').classList.toggle('hidden',['manager','assistant'].includes($('#uRole').value));
  syncDept(); $('#uRole').onchange=syncDept;
  $('#mClose').onclick=closeModal; $('#uBack').onclick=openUsers;
  if($('#uSave')) $('#uSave').onclick=async()=>{
    const name=$('#uName').value.trim(), phone=normPhone($('#uPhone').value), pass=$('#uPass').value.trim(), role=$('#uRole').value;
    if(!name) return $('#uErr').textContent='اكتب الاسم';
    if(phone.length<9) return $('#uErr').textContent='رقم التلفون مش صحيح';
    if(data.users.some(x=>x.id!==u.id && normPhone(x.phone)===phone)) return $('#uErr').textContent='هالرقم مستخدم لموظف تاني';
    if((isNew||pass) && pass.length<6) return $('#uErr').textContent='كلمة السر لازم تكون 6 أحرف أو أرقام أو أكتر';
    const oldPhone=u.phone;
    u.email=$('#uEmail').value.trim(); u.lang=$('#uLang').value;
    u.name=name; u.phone=phone; u.role=role; u.dept=['manager','assistant'].includes(role)?'':$('#uDept').value;
    if(!LIVE){ if(pass) u.password=pass; if(isNew) data.users.push(u); DB.save(); }
    const btn=$('#uSave'); btn.disabled=true; btn.textContent='لحظة…';
    try{ await API.putUser(u,isNew,pass,oldPhone); }
    catch(e){ btn.disabled=false; btn.textContent='حفظ'; return $('#uErr').textContent=errMsg(e) }
    toast(isNew?`انضاف ${name} · كلمة السر: ${pass}`:(pass?`انحفظ · كلمة السر الجديدة: ${pass}`:'انحفظ')); openUsers(); render();
  };
  if($('#uDel')) $('#uDel').onclick=()=>{const b=$('#uDel'); if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='متأكد؟';return}
    if(!LIVE){ data.users=data.users.filter(x=>x.id!==u.id); data.tasks.forEach(t=>{if(t.assignee===u.id)t.assignee='';t.sharedWith=t.sharedWith.filter(x=>x!==u.id)}); DB.save(); }
    API.delUser(u).then(()=>{toast('انحذف الموظف');openUsers();render()}).catch(e=>$('#uErr').textContent=errMsg(e))};
}

const seenKey = () => 'mahami_seen_'+(me?.id||'');
function lastSeen(){ try{return +localStorage.getItem(seenKey())||0}catch(e){return 0} }
function markSeen(){ try{localStorage.setItem(seenKey(),String(Date.now()))}catch(e){} }
function setBadge(id,n){ const b=$('#bg-'+id); if(!b) return; b.textContent=n>99?'99+':(n||''); b.classList.toggle('on',n>0) }
function updateBadges(){
  const d=DB.load(), ls=lastSeen();
  setBadge('tasks', UI.page==='tasks'?0 : d.tasks.filter(t=>t.assignee===me.id && t.status!=='done' && (t.updatedAt||t.createdAt||0)>ls).length);
  setBadge('daily', myRoutinesToday().filter(r=>!isChecked(r)).length);
  setBadge('requests', d.requests.filter(r=>r.to===me.id && r.status==='open').length);
  setBadge('mine', myItems().filter(x=>!x.done && x.date && x.date<=today()).length);
  const lsts=myLists(); $('#navLists').classList.toggle('hidden', !lsts.length && !isTop(me));
  const isMgr=me.role==='manager'; $('#navMgr').classList.toggle('hidden',!isMgr);
  setBadge('mgr', isMgr ? DB.load().mgrItems.filter(x=>!x.done && x.date && x.date<=today()).length : 0);
  setBadge('lists', lsts.filter(l=>(l.members||[]).includes(me.id)).flatMap(l=>listItemsOf(l.id)).filter(x=>!x.done && x.date && x.date<=today()).length);
}

function intlPhone(p){ let d=normPhone(p); if(!d) return ''; if(COUNTRY_CODE==='225') return d.length===10?'225'+d:d; return d.startsWith('0')?COUNTRY_CODE+d.slice(1):d }
function waLink(uid,text,label='واتساب'){
  const u=userById(uid); if(!u || u.id===me.id || !u.phone) return '';
  return `<a class="btn wa" href="https://wa.me/${intlPhone(u.phone)}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${ic('wa',15)} ${label}</a>`;
}
const isFr = uid => userById(uid)?.lang==='fr';
const frS = x => String(x||'').replace(FR_RE, m=>FR_MAP[m]);
const fmtDateL = (d,fr) => d ? new Date(d+'T00:00:00').toLocaleDateString(fr?'fr-FR':'ar-u-nu-latn',{day:'numeric',month:'short'}) : '';
const taskSubj = t => isFr(t.assignee) ? 'Tâche : '+t.title : 'مهمة: '+t.title;
function waTaskText(t){
  if(isFr(t.assignee)){ const f=Object.entries(t.fields||{}).filter(([k,v])=>v&&k!=='recurring').map(([k,v])=>`${frS((DEPTS[t.dept].fields.find(x=>x.k===k)||{}).l||k)} : ${v}`).join('\n');
    return `Tâche : ${t.title}\nService : ${frS(DEPTS[t.dept].name)}${t.due?'\nÉchéance : '+fmtDateL(t.due,true):''}${t.priority==='high'?'\nUrgent':''}${t.desc?'\n'+t.desc:''}${f?'\n'+f:''}\n\n${pageUrl()}` }
  const f=Object.entries(t.fields||{}).filter(([k,v])=>v&&k!=='recurring').map(([k,v])=>`${(DEPTS[t.dept].fields.find(x=>x.k===k)||{}).l||k}: ${v}`).join('\n');
  return `مهمة: ${t.title}\nالقسم: ${DEPTS[t.dept].name}${t.due?'\nالتسليم: '+fmtDate(t.due):''}${t.priority==='high'?'\nعاجلة':''}${t.desc?'\n'+t.desc:''}${f?'\n'+f:''}\n\n${pageUrl()}`;
}
function sendMail(ids,subject,body){
  if(!EMAIL_WEBHOOK) return; const d=DB.load();
  const to=[...new Set(ids.map(id=>d.users.find(u=>u.id===id)?.email).filter(Boolean))]; if(!to.length) return;
  try{ fetch(EMAIL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:EMAIL_TOKEN,to:to.join(','),subject,body:body+'\n\n'+pageUrl()})}).catch(()=>{}) }catch(e){}
}

const FR_MAP = {}; FR_PAIRS.forEach(([a,f])=>{ if(!(a in FR_MAP)) FR_MAP[a]=f });
const FR_RE = new RegExp('(?<![\\u0621-\\u064A])(?:'+Object.keys(FR_MAP).sort((a,b)=>b.length-a.length).map(escRe).join('|')+')(?![\\u0621-\\u064A])','g');
const trText = str => (LANG!=='fr' || !/[؀-ۿ]/.test(str)) ? str : str.replace(FR_RE, m=>FR_MAP[m]).replace(/،/g,',').replace(/؟/g,'?');
function trTree(root){
  if(LANG!=='fr' || !root) return;
  if(root.nodeType===3){ const p=root.parentElement; if(p && !p.closest('[data-notr],textarea,script,style')){ const v=trText(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v } return }
  if(root.nodeType!==1) return;
  const els=[root,...root.querySelectorAll('*')];
  els.forEach(el=>{ if(el.closest('[data-notr]')) return; ['placeholder','aria-label','title'].forEach(a=>{ const v=el.getAttribute&&el.getAttribute(a); if(v&&/[؀-ۿ]/.test(v)) el.setAttribute(a,trText(v)) }) });
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; const list=[]; while((n=w.nextNode())) list.push(n); list.forEach(trTree);
}
new MutationObserver(ms=>{ if(LANG!=='fr') return; ms.forEach(m=>{ if(m.type==='characterData') trTree(m.target); else m.addedNodes.forEach(trTree) }) })

function setLang(l,save){

  const b=$('#btnLang'); if(b) b.querySelector('span').textContent=LANG==='fr'?'ع':'FR';

  if(LANG==='fr'){ document.body.dataset.wasFr='1'; trTree(document.body) }

function mailLink(uid,subject,body,label='إيميل'){

}
function itemLine(x,i,n,fr){

  if(fr){ if(x.kind==='request') return `${p}Demande : ${x.title}${x.due?' · pour le '+fmtDateL(x.due,true):''}${x.priority==='high'?' · urgent':''}${x.details?'\n   '+x.details:''}`;

}

const daysLate = t => Math.round((new Date(today()+'T12:00:00')-new Date(t.due+'T12:00:00'))/864e5);
function remindGroups(){
  const g={};
  DB.load().tasks.filter(t=>canSee(t)&&!isArchived(t)&&t.status!=='done'&&t.assignee&&t.assignee!==me.id).forEach(t=>(g[t.assignee]??=[]).push(t));
  return Object.entries(g).map(([uid,ts])=>({uid,late:ts.filter(isLate).sort((a,b)=>a.due.localeCompare(b.due)),open:ts.filter(t=>!isLate(t)).sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9')))}))
    .sort((a,b)=>b.late.length-a.late.length||b.open.length-a.open.length);
}
function remindText(uid,late,open){
  const u=userById(uid), fr=isFr(uid);
  const L=(t,i)=>fr?`${i+1}. ${t.title} · en retard de ${daysLate(t)} jour${daysLate(t)>1?'s':''}`:`${i+1}. ${t.title} · متأخرة ${daysLate(t)===1?'يوم':daysLate(t)===2?'يومين':daysLate(t)+' أيام'}`;
  const O=(t,i)=>fr?`${i+1}. ${t.title}${t.due?' · échéance '+fmtDateL(t.due,true):''}`:`${i+1}. ${t.title}${t.due?' · التسليم '+fmtDateL(t.due):''}`;
  const parts=[fr?`Bonjour ${u?.name||''},`:`مرحبا ${u?.name||''}،`];
  if(late.length) parts.push((fr?'⚠️ Tâches en retard :':'⚠️ مهام متأخرة:')+'\n'+late.map(L).join('\n'));
  if(open.length) parts.push((fr?'⏳ Tâches en cours :':'⏳ مهام لسا قيد التنفيذ:')+'\n'+open.map(O).join('\n'));
  parts.push((fr?'Merci de mettre à jour le statut sur la page des tâches :':'يرجى تحديث الحالة عـ صفحة المهام:')+'\n'+pageUrl());
  return parts.join('\n\n');
}

function nextDate(d,rep){

  if(rep==='daily') x.setDate(x.getDate()+1); else if(rep==='weekly') x.setDate(x.getDate()+7); else if(rep==='monthly') x.setMonth(x.getMonth()+1);
  return isoLocal(x);
}

function bindPhotos(t){
  const inp=$('#tPhoto');
  if(inp) inp.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ toast('عم جهّز الصورة…'); const src=await shrink(f);
      t.photos.push({src,by:me.id,byName:me.name,at:Date.now()}); t.notes.push({by:me.id,byName:me.name,text:'ضاف صورة',at:Date.now()}); t.updatedAt=Date.now(); DB.save();

    }catch(err){ errToast(err) } };
  document.querySelectorAll('.photos .ph[data-i]').forEach(b=>b.onclick=()=>viewPhoto(t,+b.dataset.i));

function shrink(file,max=900){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      let out=c.toDataURL('image/jpeg',.6); if(out.length>150000) out=c.toDataURL('image/jpeg',.4); if(out.length>150000){ c.width/=1.5; c.height/=1.5; c.getContext('2d').drawImage(img,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',.45) }
      res(out) };
    img.onerror=()=>rej(new Error('ما قدرت أقرا الصورة')); img.src=url });
}
function viewPhoto(t,i){

function exportCSV(src){
  const list=src||filtered(); const keys=[...new Set(list.flatMap(t=>Object.keys(t.fields||{})))].filter(k=>k!=='recurring');
  const lbl=k=>{for(const D of Object.values(DEPTS)){const f=D.fields.find(x=>x.k===k); if(f) return f.l} return k};

  const rows=list.map(t=>[DEPTS[t.dept].name,t.title,t.type,uname(t.assignee),(STATUSES.find(s=>s.k===t.status)||{}).l,isLate(t)?'نعم':'',PRI[t.priority],t.due,REPEAT[t.repeat||'none'],t.desc,(t.notes||[]).length,...keys.map(k=>(t.fields||{})[k]||'')]);
  const csv='﻿'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='mahami-'+today()+'.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('تنزّل الملف') }
  catch(e){ toast('ما قدرت نزّل الملف من هون') }

function buildReport(){
  const d=DB.load(), ts=d.tasks.filter(canSee), L=[];
  L.push(`تقرير المهام · ${fmtDate(today())}`,'');
  Object.keys(DEPTS).forEach(k=>{ const x=ts.filter(t=>t.dept===k); if(!x.length) return;
    L.push(`■ ${DEPTS[k].name}: ${x.length} مهمة · مفتوحة ${x.filter(t=>t.status!=='done'&&!isLate(t)).length} · متأخرة ${x.filter(isLate).length} · منتهية ${x.filter(t=>t.status==='done').length}`);
    if(DEPTS[k].summary){ const c=x.reduce((s,t)=>s+(+(t.fields||{}).cost||0),0), p=x.reduce((s,t)=>s+(+(t.fields||{}).paid||0),0); L.push(`  التكاليف ${money(c)} · المدفوع ${money(p)} · الباقي ${money(c-p)}`) } });
  const late=ts.filter(isLate); if(late.length){ L.push('','المهام المتأخرة:'); late.forEach(t=>L.push(`- ${t.title} · ${DEPTS[t.dept].short} · ${uname(t.assignee)} · كان لازم ${fmtDate(t.due)}`)) }
  const open=ts.filter(t=>t.status!=='done'&&!isLate(t)); if(open.length){ L.push('','المفتوحة حسب الموظف:'); const g={}; open.forEach(t=>(g[uname(t.assignee)]??=[]).push(t)); Object.entries(g).forEach(([n,x])=>L.push(`- ${n}: ${x.map(t=>t.title+(t.due?' ('+fmtDate(t.due)+')':'')).join('، ')}`)) }
  const rq=d.requests.filter(r=>(isTop(me)||r.from===me.id||r.to===me.id)&&(r.status==='open'||r.status==='accepted')); if(rq.length){ L.push('','طلبات لسا مفتوحة:'); rq.forEach(r=>L.push(`- ${uname(r.from)} طالب من ${uname(r.to)}: ${r.title} (${REQ_ST[r.status]})`)) }
  const staff=d.users.filter(u=>d.routines.some(r=>r.userId===u.id)); if(staff.length && canDaily()){ L.push('','اليومية لليوم:'); staff.forEach(u=>{const rs=myRoutinesToday(u.id); if(rs.length) L.push(`- ${u.name}: ${rs.filter(r=>isChecked(r,u.id)).length} من ${rs.length}`)}) }
  return L.join('\n');
}

/* ---- الأرشيف ---- */
const ARCHIVE_DAYS=10;
const isArchived = t => t.status==='done' && (t.doneAt||t.updatedAt||t.createdAt||0) < Date.now()-ARCHIVE_DAYS*864e5;
function archiveList(){
  const A=UI.arch||(UI.arch={q:'',from:'',to:'',dept:'',who:''});
  let list=DB.load().tasks.filter(t=>canSee(t)&&isArchived(t));
  if(A.dept) list=list.filter(t=>t.dept===A.dept);
  if(A.who) list=list.filter(t=>t.assignee===A.who);
  const dd=t=>isoLocal(new Date(t.doneAt||t.updatedAt||t.createdAt||0));
  if(A.from) list=list.filter(t=>dd(t)>=A.from); if(A.to) list=list.filter(t=>dd(t)<=A.to);
  if(A.q){ const q=A.q.trim(); list=list.filter(t=>[t.title,t.type,t.desc,uname(t.assignee),...Object.values(t.fields||{})].join(' ').includes(q)) }
  return list.sort((a,b)=>(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0));
}
function renderArchive(){
  const A=UI.arch||(UI.arch={q:'',from:'',to:'',dept:'',who:''}), list=archiveList(), d=DB.load();
  const depts=isTop(me)?Object.keys(DEPTS):scopeOf(me);
  const who=[...new Set(d.tasks.filter(t=>canSee(t)&&isArchived(t)).map(t=>t.assignee).filter(Boolean))];
  $('#content').innerHTML=`<div class="card"><div class="calh"><b>${ic('archive',16)} الأرشيف <span class="muted small">(المنتهية من أكتر من ${ARCHIVE_DAYS} أيام)</span></b><button class="xbtn sm" id="arClose" aria-label="إغلاق">${ic('x',16)}</button></div>
    <div class="inp" data-ic="search">${ic('search',18)}<input id="arQ" type="search" value="${esc(A.q)}" placeholder="ابحث بالأرشيف…"></div>
    <div class="row2" style="margin-top:6px"><div><label>من تاريخ</label><input id="arFrom" type="date" value="${A.from}"></div><div><label>لتاريخ</label><input id="arTo" type="date" value="${A.to}"></div>
      <div><label>القسم</label><select id="arDept"><option value="">كل الأقسام</option>${depts.map(k=>`<option value="${k}" ${k===A.dept?'selected':''}>${DEPTS[k].name}</option>`).join('')}</select></div>
      <div><label>الموظف</label><select id="arWho"><option value="">كل الموظفين</option>${who.map(id=>`<option value="${id}" ${id===A.who?'selected':''}>${esc(uname(id))}</option>`).join('')}</select></div></div>
    <div class="actions" style="margin-top:10px"><span class="small muted" style="flex:1">${list.length} مهمة</span>${canReports()?`<button class="tbtn" id="arCsv">${ic('download',15)} تصدير Excel</button>`:''}</div></div>
    <div class="list">${list.map(taskCard).join('')||`<div class="empty"><span class="eico">${ic('archive',28)}</span><div>ما في شي بالأرشيف هون</div></div>`}</div>`;
  const set=(k,v)=>{ A[k]=v; renderArchive() };
  $('#arClose').onclick=()=>{ UI.view='list'; render() };
  $('#arQ').oninput=e=>{ A.q=e.target.value; clearTimeout(UI._arT); UI._arT=setTimeout(()=>{ renderArchive(); const q=$('#arQ'); q.focus(); q.setSelectionRange(q.value.length,q.value.length) },350) };
  $('#arFrom').onchange=e=>set('from',e.target.value); $('#arTo').onchange=e=>set('to',e.target.value);
  $('#arDept').onchange=e=>set('dept',e.target.value); $('#arWho').onchange=e=>set('who',e.target.value);
  if($('#arCsv')) $('#arCsv').onclick=()=>exportCSV(list);
  $('#content').querySelectorAll('.task').forEach(b=>b.onclick=()=>openTask(b.dataset.id));
}

/* ---- التقويم: شهري وأسبوعي ---- */
const addDays=(iso,n)=>{ const x=new Date(iso+'T12:00:00'); x.setDate(x.getDate()+n); return isoLocal(x) };
const weekStart=iso=>{ const x=new Date(iso+'T12:00:00'); x.setDate(x.getDate()-x.getDay()); return isoLocal(x) };
function calTasks(){ return filtered() }
function renderCal(){
  const base=calTasks(), now=new Date(); if(!UI.cal) UI.cal={y:now.getFullYear(),m:now.getMonth()};
  UI.calMode=UI.calMode||'month'; if(!UI.wk) UI.wk=weekStart(today());
  const week=UI.calMode==='week';
  const {y,m}=UI.cal, first=new Date(y,m,1);
  const title= week ? `${fmtDate(UI.wk)} – ${fmtDate(addDays(UI.wk,6))}` : first.toLocaleDateString(LOCALE(),{month:'long',year:'numeric'});
  let body='';
  if(!week){
    const days=new Date(y,m+1,0).getDate(), pre=`${y}-${pad(m+1)}`, byDay={};
    base.forEach(t=>{ if(t.due&&t.due.startsWith(pre)) (byDay[+t.due.slice(8)]??=[]).push(t) });
    let cells=''; for(let i=0;i<first.getDay();i++) cells+='<div class="cd blank"></div>';
    for(let dd=1;dd<=days;dd++){ const iso=`${pre}-${pad(dd)}`, ts=byDay[dd]||[];
      cells+=`<button class="cd ${iso===today()?'today':''}" data-d="${iso}"><span class="dn">${dd}</span><span class="dots">${ts.some(isLate)?'<i class="late"></i>':''}${ts.some(t=>t.status!=='done'&&!isLate(t))?'<i class="open"></i>':''}${ts.some(t=>t.status==='done')?'<i class="done"></i>':''}</span>${ts.length>1?`<span class="cc">${ts.length}</span>`:''}</button>` }
    body=`<div class="cgrid">${WSHORT.map(w=>`<div class="cw">${w}</div>`).join('')}${cells}</div>`;
  } else {
    body='<div class="wk">'+[0,1,2,3,4,5,6].map(i=>{ const iso=addDays(UI.wk,i), ts=base.filter(t=>t.due===iso);
      return `<div class="wrow ${iso===today()?'today':''}"><button class="wday" data-d="${iso}"><b>${WSHORT[new Date(iso+'T12:00:00').getDay()]}</b><span>${fmtDate(iso)}</span></button>
        <div class="wtasks">${ts.map(t=>`<button class="wchip ${isLate(t)?'late':t.status==='done'?'done':''}" data-id="${t.id}">${ic(t.dept,13)}<span data-notr>${esc(t.title)}</span></button>`).join('')||'<span class="small muted">—</span>'}</div></div>` }).join('')+'</div>';
  }
  $('#content').innerHTML=`<div class="card cal"><div class="calh">
      <button class="ibtn" id="cPrev" aria-label="قبل">${ic('arrowR',18)}</button>
      <button class="caltitle" id="cTitle">${title} ${ic('calendar',14)}</button>
      <button class="ibtn" id="cNext" aria-label="بعد">${ic('chev',18)}</button>
      <button class="xbtn sm" id="cClose" aria-label="إغلاق التقويم">${ic('x',16)}</button></div>
    <div class="calbar"><div class="seg sm"><button data-cm="month" class="${!week?'on':''}">شهري</button><button data-cm="week" class="${week?'on':''}">أسبوعي</button></div><button class="tbtn" id="cToday">اليوم</button><input type="date" id="cPick" class="vh"></div>
    ${body}
    <div class="legend"><span><i class="late"></i>متأخرة</span><span><i class="open"></i>مفتوحة</span><span><i class="done"></i>منتهية</span></div></div>`;
  const go=iso=>{ const x=new Date(iso+'T12:00:00'); UI.cal={y:x.getFullYear(),m:x.getMonth()}; UI.wk=weekStart(iso) };
  $('#cPrev').onclick=()=>{ if(week) UI.wk=addDays(UI.wk,-7); else UI.cal=m===0?{y:y-1,m:11}:{y,m:m-1}; renderCal() };
  $('#cNext').onclick=()=>{ if(week) UI.wk=addDays(UI.wk,7); else UI.cal=m===11?{y:y+1,m:0}:{y,m:m+1}; renderCal() };
  $('#cToday').onclick=()=>{ go(today()); renderCal(); openDay(today()) };
  $('#cClose').onclick=()=>{ UI.view='list'; render() };
  $('#cTitle').onclick=()=>{ const p=$('#cPick'); try{ p.showPicker() }catch(e){ p.focus(); p.click() } };
  $('#cPick').onchange=e=>{ if(!e.target.value) return; go(e.target.value); renderCal(); openDay(e.target.value) };
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ UI.calMode=b.dataset.cm; if(UI.calMode==='week'&&!UI.wk) UI.wk=weekStart(today()); renderCal() });
  $('#content').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openDay(b.dataset.d));
  $('#content').querySelectorAll('.wchip').forEach(b=>b.onclick=()=>openTask(b.dataset.id));
}
function openDay(iso){
  const ts=calTasks().filter(t=>t.due===iso);
  openModal(`<div class="shead"><h2>${ic('calendar',18)} ${fmtDate(iso)} <span class="muted small">${WDAYS[new Date(iso+'T12:00:00').getDay()]}</span></h2><button class="xbtn" id="mClose" aria-label="إغلاق">${ic('x',18)}</button></div>
    <div class="list">${ts.map(taskCard).join('')||'<div class="empty"><div>ما في مهام بهاليوم</div></div>'}</div>
    ${canCreate()?`<div class="actions"><button class="primary" id="dAdd">${ic('plus',15)} مهمة لهاليوم</button></div>`:''}`);
  $('#mClose').onclick=closeModal;
  document.querySelectorAll('#modalRoot .task').forEach(b=>b.onclick=()=>openTask(b.dataset.id));
  if($('#dAdd')) $('#dAdd').onclick=()=>{ PREFILL={due:iso}; openTask(null,true, UI.tab in DEPTS && creatableDepts().includes(UI.tab) ? UI.tab : null) };
}

/* ---- اليومية ---- */
function myRoutinesToday(uid=me.id){ return DB.load().routines.filter(r=>r.userId===uid && (r.days||[0,1,2,3,4,5,6]).includes(wd())).sort((a,b)=>(a.order||0)-(b.order||0)) }
function checkDoc(uid=me.id){ return DB.load().checks.find(c=>c.userId===uid && c.date===today()) }
function isChecked(r,uid=me.id){ return !!checkDoc(uid)?.done?.[r.id] }
const daysLabel = ds => (!ds||ds.length===7)?'كل يوم':ds.slice().sort().map(i=>WSHORT[i]).join('، ');
function toggleCheck(rid){
  const old=checkDoc(); const c=old?{...old,done:{...old.done}}:{id:today()+'_'+me.id,userId:me.id,dept:me.dept||'',date:today(),done:{}};
  if(c.done[rid]) delete c.done[rid]; else c.done[rid]=Date.now();
  API.put('checks',c).catch(errToast); render();
}

  const el=$('#page-daily'), mine=myRoutinesToday(), dn=mine.filter(r=>isChecked(r)).length, boss=canDaily();

  if(mine.length){
    const c=checkDoc();
    h+=`<div class="card"><div class="dprog"><div class="bar"><i style="--w:${Math.round(dn/mine.length*100)}%"></i></div><b>${dn} من ${mine.length}</b></div>
      <div class="checklist">${mine.map(r=>{const on=isChecked(r);return `<button class="citem ${on?'on':''}" data-r="${r.id}">${ic(on?'boxcheck':'box',22)}<span>${esc(r.title)}</span>${on?`<small>${fmtClock(c.done[r.id])}</small>`:''}</button>`}).join('')}</div>
      ${dn===mine.length?`<div class="alldone">${ic('done',18)} خلصت كل مهام اليوم، يعطيك العافية</div>`:''}</div>`;
  } else if(!boss) h+=`<div class="empty"><span class="eico">${ic('sun',28)}</span><div>ما في مهام يومية إلك اليوم</div></div>`;
  if(boss){
    const d=DB.load(), staff=d.users.filter(u=>u.id!==me.id && !isTop(u) && (isTop(me)||inScope(u.dept)));
    h+=`<h3 class="sh">${ic('users',16)} يومية الموظفين اليوم</h3>`;
    const withR=staff.filter(u=>DB.load().routines.some(r=>r.userId===u.id)), without=staff.filter(u=>!withR.includes(u));
    if(without.length) h+=`<div class="small muted" style="margin-bottom:8px">بدون مهام يومية: ${without.map(u=>`<button class="linkb" data-edit="${u.id}">${esc(u.name)}</button>`).join(' · ')}</div>`;
    h+= withR.length?`<div class="grid">${withR.map(u=>{ const rs=myRoutinesToday(u.id), c=checkDoc(u.id), k=rs.filter(r=>c?.done?.[r.id]).length;
      return `<div class="wcard"><div class="h"><div class="av">${esc(u.name[0])}</div><div style="flex:1;min-width:0"><div style="font-weight:500">${esc(u.name)}</div><div class="small muted">${roleName(u.role)}${u.dept?' · '+DEPTS[u.dept].short:''}</div></div><button class="small ibtn" data-edit="${u.id}" aria-label="تعديل اليومية">${ic('edit',15)}</button></div>
        ${rs.length?`<div class="bar"><i style="--w:${Math.round(k/rs.length*100)}%"></i></div><div class="small muted">${k} من ${rs.length}</div>
        ${rs.map(r=>{const on=c?.done?.[r.id];return `<div class="ditem ${on?'on':''}">${ic(on?'boxcheck':'box',16)}<span>${esc(r.title)}</span>${on?`<small>${fmtClock(on)}</small>`:''}</div>`}).join('')}`:'<div class="small muted">ما في مهام يومية اليوم</div>'}</div>`}).join('')}</div>`
      : (staff.length?'':'<div class="small muted">ما في موظفين لسا</div>');

  el.innerHTML=h;

function openRoutines(uId){

    <div class="sect"><h3>${ic('plus',15)} إضافة مهمة يومية لـ ${esc(u.name)}</h3>
      <input id="rTitle" placeholder="مثلاً: فحص السيارة قبل الطلعة">
      <label>بأي أيام؟</label><div class="days" id="rDays">${WSHORT.map((w,i)=>`<button type="button" data-d="${i}" class="on">${w}</button>`).join('')}</div>
      <div class="err" id="rErr"></div>

    const title=$('#rTitle').value.trim(), days=[...$('#rDays').querySelectorAll('.on')].map(b=>+b.dataset.d);

/* ---- الطلبات ---- */
function reqChip(r){ const c={open:'s-new',accepted:'s-progress',done:'s-done',rejected:'s-late'}, i={open:'new',accepted:'progress',done:'done',rejected:'x'}; return `<span class="chip ${c[r.status]}">${ic(i[r.status],13)}${REQ_ST[r.status]}</span>` }
function reqCard(r,i=0){
  const late=(r.status==='open'||r.status==='accepted')&&r.due&&r.due<today(), incoming=r.to===me.id;
  return `<button style="--i:${Math.min(i,12)}" class="task ${late?'is-late':''} ${r.status==='done'||r.status==='rejected'?'is-done':''}" data-q="${r.id}">
    ${dateStub({due:r.due,status:r.status==='done'||r.status==='rejected'?'done':'open'},late)}
    <div class="tbody"><div class="top"><span class="t" data-notr>${esc(r.title)}</span>${reqChip(r)}</div>
      <div class="meta"><span class="mdept ${incoming?'d-in':'d-out'}">${ic(incoming?'inbox':'out',13)}${incoming?'واردة':'مرسلة'}</span><span>${ic('user',14)}${esc(uname(r.from))} ${ic('chev',12)} ${esc(uname(r.to))}</span>
        ${r.priority==='high'?`<span class="pri-high">${ic('flag',14)}عاجل</span>`:''}
        ${r.notes?.length?`<span class="cnt">${ic('message',14)}${r.notes.length}</span>`:''}</div></div>
    <span class="chev">${ic('chev',18)}</span></button>`;
}
function renderRequests(){
  const el=$('#page-requests'), all=DB.load().requests.filter(r=>isTop(me)||r.from===me.id||r.to===me.id);
  const tabs=[['in','واردة إلي','inbox'],['out','مرسلة مني','out']]; if(isTop(me)) tabs.push(['all','كل الطلبات','all']);
  if(!tabs.some(t=>t[0]===UI.reqTab)) UI.reqTab='in';
  const ord={open:0,accepted:1,done:2,rejected:3};
  const list=(UI.reqTab==='in'?all.filter(r=>r.to===me.id):UI.reqTab==='out'?all.filter(r=>r.from===me.id):all).sort((a,b)=>ord[a.status]-ord[b.status]||(b.createdAt||0)-(a.createdAt||0));
  const nIn=all.filter(r=>r.to===me.id&&r.status==='open').length;
  el.innerHTML=`<div class="phead"><h2>${ic('inbox',20)} الطلبات</h2><div class="muted small">اطلب شي من أي حدا، أو رد عالطلبات اللي إلك</div></div>
    <div class="tabs">${tabs.map(([k,l,i])=>`<button class="tab ${UI.reqTab===k?'on':''}" data-k="${k}">${ic(i,16)}${l}${k==='in'&&nIn?` <b class="cntb">${nIn}</b>`:''}</button>`).join('')}</div>
    <div class="list" style="margin-top:10px">${list.map(reqCard).join('')||`<div class="empty"><span class="eico">${ic('inbox',28)}</span><div>ما في طلبات هون</div><span class="small">اضغط "طلب جديد" لتطلب شي من أي حدا</span></div>`}</div>`;
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{UI.reqTab=b.dataset.k;renderRequests()});
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openRequest(b.dataset.q));
}
const reqTextFor = (r,uid) => isFr(uid) ? `Demande de ${uname(r.from)} à ${uname(r.to)} :\n${r.title}${r.details?'\n'+r.details:''}${r.due?'\nPour le : '+fmtDateL(r.due,true):''}${r.priority==='high'?'\nUrgent':''}` : reqText(r);
const reqText = r => `طلب من ${uname(r.from)} لـ ${uname(r.to)}:\n${r.title}${r.details?'\n'+r.details:''}${r.due?'\nلـ: '+fmtDate(r.due):''}${r.priority==='high'?'\nعاجل':''}`;
function openRequest(id,preset={}){
  const d=DB.load();
  if(!id){
    const r={id:'q'+uid(),from:me.id,to:preset.to||'',title:preset.title||'',details:preset.details||'',due:preset.due||'',priority:preset.priority||'normal',status:'open',notes:[],createdAt:Date.now()};
    const ord={manager:0,assistant:1,head:2,worker:3};
    const people=d.users.filter(u=>u.id!==me.id).sort((a,b)=>ord[a.role]-ord[b.role]||(a.dept||'').localeCompare(b.dept||''));
    openModal(`<div class="shead"><h2>${ic('inbox',18)} طلب جديد</h2><button class="xbtn" id="mClose" aria-label="إغلاق">${ic('x',18)}</button></div>
      <label>من مين بدك تطلب؟</label><select id="qTo"><option value="">— اختار —</option>${people.map(u=>`<option value="${u.id}" ${u.id===r.to?'selected':''}>${esc(u.name)} · ${roleName(u.role)}${u.dept?' · '+DEPTS[u.dept].short:''}</option>`).join('')}</select>

const REP_ITEM = {none:'ما بيتكرر',daily:'يومياً',weekly:'أسبوعياً',monthly:'شهرياً',every:'كل كم يوم',weekdays:'أيام معيّنة'};
function repeatLabel(x){
  const r=x.repeat||'none'; if(r==='none') return '';
  if(r==='every') return `كل ${x.every||1} أيام`;
  if(r==='weekdays') return (x.days||[]).slice().sort().map(i=>WSHORT[i]).join('، ')||'أيام معيّنة';
  return REP_ITEM[r];
}
function nextOcc(x){
  const t0=today(), base=x.date&&x.date>=t0?x.date:t0, r=x.repeat||'none';
  if(r==='daily') return addDays(base,1);
  if(r==='weekly') return addDays(base,7);
  if(r==='monthly'){ const d=new Date(base+'T12:00:00'); d.setMonth(d.getMonth()+1); return isoLocal(d) }
  if(r==='every') return addDays(base,Math.max(1,+x.every||1));
  if(r==='weekdays'){ const ds=x.days||[]; for(let i=1;i<=7;i++){ const c=addDays(base,i); if(ds.includes(new Date(c+'T12:00:00').getDay())) return c } return addDays(base,7) }
  return null;
}

var REC=null, VD=[];
const AR = s => String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const SPLIT_RE = /\s*(?:[.\n؟?!؛;]+|\s(?:و?كمان|و?بعدين|و?بعدها|و?بعد هيك|و?تاني شي|و?ثاني شي|نقطه|نقطة)\s)\s*/;
const DEPT_KW = {fire:['eurofeu','يوروفو','اوروفو','حريق','طفاي','انذار','رشاش','دفاع مدني','صيانه'],build:['sepc','سيبك','سبك','معدات البناء','شحن','جمارك','جمرك','حديد','اسمنت','خلاط','استيراد','مستودع','طلبيه','مخلص'],project:['نهله','بنايه','طابق','سقف','صب','بلاط','مقاول','عماره'],admin:['مكتب','اوراق','معامله','سجل','اجتماع','مراسل','قرطاسيه','بنك','فاتوره'],market:['سوق','السوق','شراء','اشتري','مشتريات','توصيل','وصل','محل','تحصيل']};
const DATE_WORDS_RE = /(^|\s)(?:يوم\s|نهار\s)?(?:اليوم|بكرا|بكرة|بكره|غدا|غداً|بعد بكرا|بعد بكرة|بعد بكره|بعد غد|ال?(?:أحد|احد|اثنين|إثنين|اتنين|تنين|ثلاثاء|ثلاثا|تلاتا|تلاتاء|أربعاء|اربعاء|أربعا|اربعا|خميس|جمعة|جمعه|سبت)(?:\sالجاي|\sالجاية|\sالقادم)?|الأسبوع الجاي|الاسبوع الجاي|الأسبوع القادم|الاسبوع القادم|آخر الشهر|اخر الشهر|بعد \S+ (?:أيام|ايام|يوم))(?=$|\s|[،,.])/g;
function parseDue(n){
  if(/بعد (بكرا|بكره|غد)/.test(n)) return today(2);
  if(/(^|\s)(بكرا|بكره|غدا)(\s|$)/.test(n)) return today(1);
  if(/(^|\s)اليوم(\s|$)/.test(n)) return today(0);
  const m=n.match(/بعد (\d+|يومين|تلات|ثلاث|اربع|خمس|ست|سبع|عشر)\s*(ايام|يوم)?/);
  if(m){ const w={يومين:2,تلات:3,ثلاث:3,اربع:4,خمس:5,ست:6,سبع:7,عشر:10}; const k=+m[1]||w[m[1]]; if(k) return today(k) }
  if(/الاسبوع (الجاي|القادم)/.test(n)) return today(7);
  if(/اخر الشهر/.test(n)){ const d=new Date(); return isoLocal(new Date(d.getFullYear(),d.getMonth()+1,0)) }
  const D=[['احد'],['اثنين','اتنين','تنين'],['ثلاثاء','ثلاثا','تلاتا','تلاتاء'],['اربعاء','اربعا'],['خميس'],['جمعه'],['سبت']];
  for(let i=0;i<7;i++) if(D[i].some(w=>new RegExp('(^|\\s)(ال)?'+w+'(\\s|$)').test(n))){ let k=(i-wd()+7)%7; if(k===0) k=7; return today(k) }
  return '';
}
function parseOne(seg){
  const n=' '+AR(seg)+' ', d=DB.load();
  let person=null, plen=0;
  d.users.forEach(u=>{ const un=AR(u.name).trim(); if(un.length<2) return;
    if(new RegExp('\\s(و|ل|لـ|ع|مع)?'+escRe(un)+'(?=[\\s،,.])').test(n) && un.length>plen){ person=u; plen=un.length } });
  const personal=/(ذكرني|لحالي|لالي|برنامجي|علي انا)/.test(n);
  const due=parseDue(n);
  const priority=/(عاجل|ضروري|فوري|بسرعه|مستعجل)/.test(n)?'high':'normal';
  let dept=null, best=0; Object.entries(DEPT_KW).forEach(([k,ws])=>{ const sc=ws.filter(w=>n.includes(w)).length; if(sc>best){best=sc;dept=k} });
  if(person&&person.dept) dept=person.dept;
  let kind;
  if(personal||(!person&&UI.page==='mine')) kind='mine';
  else if(canCreate()){ if(!dept||!creatableDepts().includes(dept)) dept=(UI.tab in DEPTS&&creatableDepts().includes(UI.tab))?UI.tab:creatableDepts()[0]; kind=(person&&isTop(person)&&!isTop(me))?'request':'task' }
  else kind='request';
  const type=dept?(DEPTS[dept].types.find(x=>AR(x).split(' ').some(w=>w.length>3&&n.includes(w)))||DEPTS[dept].types[0]):'';
  let title=seg;
  if(person) title=title.replace(new RegExp('(^|\\s)(و|ل|لـ|ع|مع)?'+escRe(person.name)+'(?=$|\\s|[،,.])','g'),' ');
  title=title.replace(DATE_WORDS_RE,' ').replace(/(^|\s)(عاجل|عاجلة|ضروري|فوري|بسرعة|بسرعه|مستعجل)(?=$|\s|[،,.])/g,' ')
    .replace(/(^|\s)(خلي|خلّي|خللي|قول|قل|اطلب من|بدي|بدّي|ذكرني|ذكّرني|لحالي|يا)(?=\s)/g,' ')
    .replace(/\s{2,}/g,' ').replace(/^[\s،,.\-و]+|[\s،,.\-]+$/g,'').trim();
  return {kind,title:title||seg.trim(),person:person&&!(kind==='task'&&isTop(person)&&false)?person.id:'',dept:dept||'',due,priority,type,src:seg.trim()};
}
function parseVoice(text){ return (' '+text+' ').split(SPLIT_RE).map(x=>x.trim()).filter(x=>x.replace(/\s/g,'').length>3).map(parseOne) }

function openVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  openModal(`<div class="shead"><h2>${ic('mic',18)} أمر صوتي</h2><button class="xbtn" id="mClose" aria-label="إغلاق">${ic('x',18)}</button></div>
    <div class="small muted">احكي أوامرك، وافصل بين كل أمر وأمر بكلمة <b>"كمان"</b> أو <b>"بعدين"</b>. مثلاً: «خلي أحمد يعمل صيانة طفايات مطعم الريم بكرا عاجل، كمان رامي يتابع شحنة الحديد يوم الخميس»</div>
    <div class="vrow"><button class="vmic" id="vMic" aria-label="تسجيل" ${SR?'':'disabled'}>${ic('mic',30)}</button><div id="vState" class="small">${SR?'اضغط المايك وابدأ احكي':'المتصفح هون ما بيدعم التسجيل. اكتب، أو اضغط على مايك الكيبورد 🎤 جوّا المربع'}</div></div>
    <textarea id="vText" rows="4" placeholder="هون بيطلع كلامك كنص، وفيك تعدّل عليه قبل التقسيم"></textarea>
    <div class="actions"><button class="primary" id="vParse">${ic('spark',15)} قسّم لمهام</button><button id="vClear">مسح</button></div>
    <div id="vDrafts"></div>`);
  $('#mClose').onclick=closeModal;
  $('#vClear').onclick=()=>{ $('#vText').value=''; $('#vDrafts').innerHTML=''; VD=[] };
  $('#vParse').onclick=()=>{ if(REC) try{REC.stop()}catch(e){} const t=$('#vText').value.trim(); if(!t) return toast('ما في نص'); renderDrafts(parseVoice(t)) };
  if(!SR) return;
  $('#vMic').onclick=()=>{
    if(REC){ REC._stopped=true; try{REC.stop()}catch(e){} return }
    const android=/Android/i.test(navigator.userAgent);
    const base=$('#vText').value.trim(); const done=[]; let cur='', stopped=false, empty=0;
    const show=(inter='')=>{ $('#vText').value=[base,...done,cur].filter(Boolean).join(' ').replace(/\s+/g,' ').trim(); $('#vState').textContent=inter?('… '+inter):'عم اسمعك… اضغط المايك مرة تانية لما تخلص' };
    const startOne=()=>{
      const r=new SR(); r.lang=LANG==='fr'?'fr-FR':'ar-LB'; r.continuous=!android; r.interimResults=true;
      r.onstart=()=>{ REC=r; $('#vMic')?.classList.add('rec'); show() };
      r.onresult=e=>{
        // منبني النص من الأول كل مرة، ومنشيل التكرار اللي بيصير عـ أندرويد
        const fin=[]; let inter='';
        for(let i=0;i<e.results.length;i++){ const x=e.results[i], t=x[0].transcript.trim(); if(!t) continue;
          if(x.isFinal){ const last=fin[fin.length-1]; if(last && (t.startsWith(last)||last.startsWith(t))) fin[fin.length-1]=t.length>=last.length?t:last; else if(last!==t) fin.push(t) }
          else inter=t }
        cur=fin.join(' '); show(inter);
      };
      r.onerror=e=>{ if(e.error==='no-speech'||e.error==='aborted') return; stopped=true; $('#vState').textContent=e.error==='not-allowed'?'لازم تسمح للصفحة تستخدم المايك من إعدادات المتصفح':'صار خطأ بالتسجيل ('+e.error+'). جرّب مرة تانية' };
      r.onend=()=>{
        if(cur){ empty=0; const last=done[done.length-1]; if(last!==cur) done.push(cur) } else empty++; cur='';
        if(android && empty<2 && !stopped && !r._stopped && $('#vMic')){ try{ startOne(); return }catch(e){} }
        REC=null; const b=$('#vMic'); if(!b) return; b.classList.remove('rec'); show(); $('#vState').textContent='خلص التسجيل. راجع النص واضغط "قسّم لمهام"';
      };
      try{ r.start() }catch(e){ $('#vState').textContent='ما قدرت شغّل المايك' }
    };
    startOne();
  };
}

const ERRS = {
  'nouser':'هالرقم مش مسجل. اطلب من الإدارة تضيفك.',
  'auth/invalid-credential':'الرقم أو كلمة السر غلط','auth/wrong-password':'الرقم أو كلمة السر غلط','auth/user-not-found':'الرقم أو كلمة السر غلط',
  'auth/too-many-requests':'محاولات كتير. استنى شوي وجرب مرة تانية.','auth/network-request-failed':'في مشكلة بالإنترنت',
  'auth/weak-password':'كلمة السر ضعيفة، لازم 6 أحرف أو أكتر','auth/requires-recent-login':'لتغيير كلمة سرك اطلع وادخل من جديد وجرب مرة تانية',
  'permission-denied':'ما عندك صلاحية لهالعملية','phone-used':'هالرقم مستخدم لموظف تاني','inactive':'حسابك موقوف. راجع الإدارة.'
};
const errMsg = e => ERRS[e?.code||e?.message] || 'صار خطأ: '+(e?.code||e?.message||e);
const errToast = e => { console.error(e); toast(errMsg(e)) };

const API = {
  fb:null, unsubs:[], src:{},
  email(phone){ return `${normPhone(phone)}.${Date.now().toString(36)}@mahami.app` },
  async init(){
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [app,auth,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const a=app.initializeApp(FIREBASE_CONFIG);
    this.fb={app,auth,fs,a,au:auth.getAuth(a),db:fs.getFirestore(a)};
    let st=null;
    try{ st=await fs.getDoc(fs.doc(this.fb.db,'setup','state')) }
    catch(e){ console.error(e); $('#lerr').textContent = e.code==='permission-denied'
      ? 'قاعدة البيانات رافضة الطلب: تأكد إنك لصقت قواعد الصلاحيات بـ Firebase وضغطت Publish.'
      : 'ما قدرت أوصل لقاعدة البيانات: تأكد إنك عملت Firestore Database بـ Firebase. ('+(e.code||e.message)+')' }
    if(st && !st.exists()) $('#setupForm').classList.remove('hidden');
    auth.onAuthStateChanged(this.fb.au, u=>this.onAuth(u));
  },
  secondary(){ const {app,auth,fs}=this.fb; if(!this.sec) this.sec=app.initializeApp(FIREBASE_CONFIG,'secondary'); return {sa:auth.getAuth(this.sec), sdb:fs.getFirestore(this.sec)} },
  async onAuth(user){
    const {fs,db,auth,au}=this.fb;
    this.stop();
    if(!user){ showLogin(); return }
    let p=null; try{ p=await fs.getDoc(fs.doc(db,'users',user.uid)) }catch(e){}
    if(!p||!p.exists()||p.data().active===false){ await auth.signOut(au); showLogin(ERRS.inactive); return }
    me={id:user.uid,...p.data()}; mem=emptyMem(); mem.users=[me];
    this.subscribe(); startApp();
  },
  sig(){ return [isTop(me),canDaily(),scopeOf(me).join('+')].join('|') },
  subscribe(){
    const {fs,db}=this.fb; const onErr=e=>errToast(e); const C=n=>fs.collection(db,n); const W=fs.where;
    this.curSig=this.sig();
    this.unsubs.push(fs.onSnapshot(fs.doc(db,'settings','roles'), s=>{
      if(s.exists()) mem.settings={roles:s.data().roles||{}};
      else if(me?.role==='manager') fs.setDoc(fs.doc(db,'settings','roles'),{roles:JSON.parse(JSON.stringify(DEFAULT_ROLES))}).catch(onErr);
      if(this.sig()!==this.curSig){ this.stop(); this.subscribe(); }
      render() }, onErr));
    this.unsubs.push(fs.onSnapshot(C('users'), s=>{ mem.users=s.docs.map(d=>({id:d.id,...d.data()})); const m=mem.users.find(u=>u.id===me?.id); if(m) Object.assign(me,m); render() }, onErr));
    const listen=(col,key,q)=>this.unsubs.push(fs.onSnapshot(q, s=>{
      (this.src[col]??={})[key]=s.docs.map(d=>({id:d.id,...d.data()}));
      const map=new Map(); Object.values(this.src[col]).flat().forEach(x=>map.set(x.id,x)); mem[col]=[...map.values()]; if(col==='lists') this.afterLists?.(); render() }, onErr));
    const Q=(col,...w)=>fs.query(C(col),...w);
    const day=today();
    if(isTop(me)){
      listen('tasks','all',C('tasks')); listen('requests','all',C('requests')); listen('routines','all',C('routines'));
      listen('checks','all',Q('checks',W('date','==',day)));
      listen('lists','all',C('lists'));
    } else {
      scopeOf(me).forEach(d=>listen('tasks','dept-'+d,Q('tasks',W('dept','==',d))));
      listen('tasks','shared',Q('tasks',W('sharedWith','array-contains',me.id)));
      listen('requests','from',Q('requests',W('from','==',me.id))); listen('requests','to',Q('requests',W('to','==',me.id)));
      listen('routines','mine',Q('routines',W('userId','==',me.id))); listen('checks','mine',Q('checks',W('date','==',day),W('userId','==',me.id)));
      if(canDaily()) scopeOf(me).forEach(d=>{ listen('routines','dept-'+d,Q('routines',W('dept','==',d))); listen('checks','dept-'+d,Q('checks',W('date','==',day),W('dept','==',d))) });
      listen('lists','member',Q('lists',W('members','array-contains',me.id)));
    }
    listen('personal','mine',fs.collection(db,'personal',me.id,'items'));
    if(me.role==='manager') listen('mgrItems','all',C('mgrItems'));
    // بنود القوائم المشتركة: منفتح مستمع لكل قائمة
    this.itemSubs={};
    const syncItems=()=>{ const ids=new Set((mem.lists||[]).map(l=>l.id));
      Object.keys(this.itemSubs).forEach(id=>{ if(!ids.has(id)){ this.itemSubs[id](); delete this.itemSubs[id]; delete (this.src.listItems||{})[id] } });
      ids.forEach(id=>{ if(this.itemSubs[id]) return;
        this.itemSubs[id]=fs.onSnapshot(fs.collection(db,'lists',id,'items'), s=>{ (this.src.listItems??={})[id]=s.docs.map(d=>({id:d.id,listId:id,...d.data()})); mem.listItems=Object.values(this.src.listItems).flat(); render() }, onErr) }) };
    this.unsubs.push(()=>{ Object.values(this.itemSubs||{}).forEach(u=>u()); this.itemSubs={} });
    this.afterLists=syncItems;
  },
  stop(){ this.unsubs.forEach(u=>u()); this.unsubs=[]; this.src={} },
  async put(col,obj){
    const data=DB.load(); const arr=data[col]; const i=arr.findIndex(x=>x.id===obj.id); if(i<0) arr.push(obj); else arr[i]=obj; DB.save();
    if(!LIVE) return; const {fs,db}=this.fb; const {id,...rest}=obj;
    const ref = col==='personal' ? fs.doc(db,'personal',me.id,'items',id) : col==='listItems' ? fs.doc(db,'lists',obj.listId,'items',id) : fs.doc(db,col,id);
    if(col==='listItems') delete rest.listId;
    return fs.setDoc(ref, JSON.parse(JSON.stringify(rest)));
  },
  async putRoles(roles){
    const data=DB.load(); data.settings={roles}; DB.save();
    if(!LIVE) return; const {fs,db}=this.fb; return fs.setDoc(fs.doc(db,'settings','roles'),{roles:JSON.parse(JSON.stringify(roles))});
  },
  async del(col,id,listId){
    const data=DB.load(); data[col]=data[col].filter(x=>x.id!==id); DB.save();
    if(!LIVE) return; const {fs,db}=this.fb;
    return fs.deleteDoc(col==='personal' ? fs.doc(db,'personal',me.id,'items',id) : col==='listItems' ? fs.doc(db,'lists',listId,'items',id) : fs.doc(db,col,id));
  },
  async login(phone,pass){
    const {fs,db,auth,au}=this.fb;
    const s=await fs.getDoc(fs.doc(db,'logins',normPhone(phone)));
    if(!s.exists()) throw {code:'nouser'};
