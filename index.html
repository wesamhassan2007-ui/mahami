  },
  async logout(){ this.stop(); await this.fb.auth.signOut(this.fb.au) },
  async setup(name,phone,pass){
    const {auth,fs}=this.fb; const {sa,sdb}=this.secondary(); phone=normPhone(phone);
    const email=this.email(phone); const cred=await auth.createUserWithEmailAndPassword(sa,email,pass);
    const b=fs.writeBatch(sdb);
    b.set(fs.doc(sdb,'users',cred.user.uid),{name,phone,role:'manager',dept:'',active:true,createdAt:Date.now()});
    b.set(fs.doc(sdb,'logins',phone),{email});
    b.set(fs.doc(sdb,'setup','state'),{done:true,at:Date.now()});
    await b.commit(); await auth.signOut(sa);
    await this.login(phone,pass);
  },
  async putTask(t,mode){
    if(!LIVE) return; const {fs,db}=this.fb; const ref=fs.doc(db,'tasks',t.id);
    const {id,_origAssignee,...data}=t; data.sharedWith=data.sharedWith||[]; data.notes=data.notes||[];
    if(mode==='limited') return fs.updateDoc(ref,{status:t.status,stage:t.stage??null,notes:data.notes,updatedAt:t.updatedAt,photos:data.photos||[],spawned:!!t.spawned,doneAt:t.doneAt||null});
    return fs.setDoc(ref,JSON.parse(JSON.stringify(data)));
  },
  async delTask(id){ if(!LIVE) return; const {fs,db}=this.fb; return fs.deleteDoc(fs.doc(db,'tasks',id)) },
  async newAccount(phone,pass){ const {auth}=this.fb; const {sa}=this.secondary(); const email=this.email(phone);
    const cred=await auth.createUserWithEmailAndPassword(sa,email,pass); await auth.signOut(sa); return {uid:cred.user.uid,email} },
  async putUser(u,isNew,pass,oldPhone){
    if(!LIVE) return; const {fs,db,auth,au}=this.fb;
    const prof={name:u.name,phone:u.phone,role:u.role,dept:u.dept,email:u.email||'',lang:u.lang||'ar',active:true};
    const phoneChanged=!isNew && normPhone(oldPhone)!==normPhone(u.phone);
    if(isNew||phoneChanged){ const ex=await fs.getDoc(fs.doc(db,'logins',u.phone)); if(ex.exists()) throw {code:'phone-used'} }
    if(isNew){
      const {uid,email}=await this.newAccount(u.phone,pass);
      const b=fs.writeBatch(db); b.set(fs.doc(db,'users',uid),{...prof,createdAt:Date.now()}); b.set(fs.doc(db,'logins',u.phone),{email}); await b.commit(); u.id=uid; return;
    }
    if(pass && u.id===me.id){ await auth.updatePassword(au.currentUser,pass); pass='' }
    if(pass){ return this.resetPassword(u,prof,pass,oldPhone) }
    const b=fs.writeBatch(db); b.update(fs.doc(db,'users',u.id),prof);
    if(phoneChanged){ const old=await fs.getDoc(fs.doc(db,'logins',normPhone(oldPhone))); b.delete(fs.doc(db,'logins',normPhone(oldPhone))); b.set(fs.doc(db,'logins',u.phone),{email:old.data().email}) }
    await b.commit();
  },
  async resetPassword(u,prof,pass,oldPhone){
    // كلمة سر جديدة لموظف = حساب دخول جديد بنفس البيانات، ومنقل مهامه عليه
    const {fs,db}=this.fb; const oldId=u.id;
    const {uid,email}=await this.newAccount(u.phone,pass);
    const b=fs.writeBatch(db);
    b.set(fs.doc(db,'users',uid),{...prof,createdAt:Date.now()});
    if(normPhone(oldPhone)!==normPhone(u.phone)) b.delete(fs.doc(db,'logins',normPhone(oldPhone)));
    b.set(fs.doc(db,'logins',u.phone),{email});
    b.delete(fs.doc(db,'users',oldId));
    (await fs.getDocs(fs.query(fs.collection(db,'tasks'),fs.where('assignee','==',oldId)))).forEach(d=>b.update(d.ref,{assignee:uid}));
    (await fs.getDocs(fs.query(fs.collection(db,'tasks'),fs.where('sharedWith','array-contains',oldId)))).forEach(d=>b.update(d.ref,{sharedWith:d.data().sharedWith.map(x=>x===oldId?uid:x)}));
    await b.commit(); u.id=uid;
  },
  async delUser(u){
    if(!LIVE) return; const {fs,db}=this.fb; const b=fs.writeBatch(db);
    b.delete(fs.doc(db,'users',u.id)); b.delete(fs.doc(db,'logins',normPhone(u.phone)));
    (await fs.getDocs(fs.query(fs.collection(db,'tasks'),fs.where('assignee','==',u.id)))).forEach(d=>b.update(d.ref,{assignee:''}));
    (await fs.getDocs(fs.query(fs.collection(db,'tasks'),fs.where('sharedWith','array-contains',u.id)))).forEach(d=>b.update(d.ref,{sharedWith:d.data().sharedWith.filter(x=>x!==u.id)}));
    await b.commit();
  }
};
$('#setupForm').addEventListener('submit',async e=>{ e.preventDefault();
  const n=$('#sn').value.trim(), p=normPhone($('#sp').value), w=$('#sw').value;
  if(!n||p.length<9) return $('#serr').textContent='اكتب اسمك ورقم صحيح';
  if(w.length<6) return $('#serr').textContent='كلمة السر لازم تكون 6 أو أكتر';
  const b=e.target.querySelector('button'); b.disabled=true; b.textContent='لحظة…';
  try{ await API.setup(n,p,w); $('#setupForm').classList.add('hidden') }catch(err){ $('#serr').textContent=errMsg(err); b.disabled=false; b.textContent='إنشاء حساب المدير' }
});
